<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .header p { opacity: 0.9; }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
        }
        .stat-card h3 {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .logs-section {
            background: #1e293b;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #334155;
        }
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logs-header h2 { font-size: 20px; }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover { background: #dc2626; }
        .btn-refresh {
            background: #667eea;
            color: white;
            margin-right: 10px;
        }
        .log-entry {
            background: #0f172a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ip-badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-family: monospace;
        }
        .time {
            color: #64748b;
            font-size: 13px;
        }
        .location {
            color: #22c55e;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .coords {
            color: #f59e0b;
            font-family: monospace;
            font-size: 13px;
        }
        .device-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }
        .device-item {
            font-size: 13px;
        }
        .device-item strong {
            color: #94a3b8;
            display: block;
            margin-bottom: 3px;
        }
        .json-view {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            overflow-x: auto;
        }
        .json-view pre {
            color: #22c55e;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }
        .map-link {
            color: #667eea;
            text-decoration: none;
        }
        .map-link:hover { text-decoration: underline; }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Analytics Dashboard</h1>
        <p>Real-time visitor tracking and geolocation data</p>
    </div>

    <div class="container">
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <h3>Total Visits</h3>
                <div class="stat-value" id="totalVisits">-</div>
            </div>
            <div class="stat-card">
                <h3>Unique IPs</h3>
                <div class="stat-value" id="uniqueIPs">-</div>
            </div>
            <div class="stat-card">
                <h3>Countries</h3>
                <div class="stat-value" id="countryCount">-</div>
            </div>
            <div class="stat-card">
                <h3>Mobile Devices</h3>
                <div class="stat-value" id="mobileCount">-</div>
            </div>
        </div>

        <div class="logs-section">
            <div class="logs-header">
                <h2>Recent Activity</h2>
                <div>
                    <button class="btn btn-refresh" onclick="loadData()">🔄 Refresh</button>
                    <button class="btn btn-danger" onclick="clearLogs()">🗑️ Clear All</button>
                </div>
            </div>
            
            <div class="filters">
                <input type="text" id="searchIP" placeholder="Search by IP..." onkeyup="filterLogs()">
                <select id="filterCountry" onchange="filterLogs()">
                    <option value="">All Countries</option>
                </select>
            </div>

            <div id="logsContainer">
                <div class="empty-state">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];

        async function loadData() {
            try {
                const [logsRes, statsRes] = await Promise.all([
                    fetch('/api/logs'),
                    fetch('/api/stats')
                ]);
                
                allLogs = await logsRes.json();
                const stats = await statsRes.json();
                
                // Update stats
                document.getElementById('totalVisits').textContent = stats.totalVisits || 0;
                document.getElementById('uniqueIPs').textContent = stats.uniqueIPs || 0;
                document.getElementById('countryCount').textContent = 
                    Object.keys(stats.countries || {}).length;
                
                // Count mobile devices
                const mobileCount = allLogs.filter(l => 
                    l.device?.device?.type === 'mobile' || 
                    l.network?.secChUaMobile === '?1'
                ).length;
                document.getElementById('mobileCount').textContent = mobileCount;
                
                // Populate country filter
                const countrySelect = document.getElementById('filterCountry');
                const countries = [...new Set(allLogs.map(l => 
                    l.geolocation?.location?.country).filter(Boolean))].sort();
                countrySelect.innerHTML = '<option value="">All Countries</option>' +
                    countries.map(c => `<option value="${c}">${c}</option>`).join('');
                
                renderLogs(allLogs);
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('logsContainer');
            
            if (logs.length === 0) {
                container.innerHTML = '<div class="empty-state">No logs yet</div>';
                return;
            }
            
            container.innerHTML = logs.map(log => {
                const geo = log.geolocation || {};
                const loc = geo.location || {};
                const coords = geo.coordinates || {};
                const device = log.device || {};
                const browser = device.browser || {};
                const os = device.os || {};
                const dev = device.device || {};
                
                const mapUrl = coords.latitude ? 
                    `https://www.google.com/maps?q=${coords.latitude},${coords.longitude}` : null;
                
                return `
                    <div class="log-entry" data-ip="${log.ip?.address}" data-country="${loc.country || ''}">
                        <div class="log-header">
                            <div>
                                <span class="ip-badge">${log.ip?.address}</span>
                                <span class="time">${new Date(log.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                        
                        ${geo.status === 'success' ? `
                            <div class="location">
                                📍 ${loc.city || 'Unknown City'}, ${loc.region || 'Unknown Region'}, ${loc.country || 'Unknown Country'}
                                ${loc.zip ? `(${loc.zip})` : ''}
                            </div>
                            ${coords.latitude ? `
                                <div class="coords">
                                    🎯 GPS: ${coords.latitude.toFixed(4)}, ${coords.longitude.toFixed(4)}
                                    ${mapUrl ? `<a href="${mapUrl}" target="_blank" class="map-link">[View on Map]</a>` : ''}
                                    <br>
                                    🌐 ISP: ${geo.isp?.name || 'Unknown'} | 
                                    📡 Connection: ${geo.connection?.mobile ? 'Mobile' : 'WiFi/Ethernet'}
                                    ${geo.connection?.proxy ? '| 🎭 Proxy/VPN' : ''}
                                    ${geo.connection?.hosting ? '| ☁️ Hosting/Datacenter' : ''}
                                </div>
                            ` : ''}
                        ` : `
                            <div class="location" style="color: #ef4444;">
                                ⚠️ ${geo.note || 'Geolocation unavailable'}
                            </div>
                        `}
                        
                        <div class="device-info">
                            <div class="device-item">
                                <strong>Browser</strong>
                                ${browser.family || 'Unknown'} ${browser.version || ''}
                            </div>
                            <div class="device-item">
                                <strong>Operating System</strong>
                                ${os.family || 'Unknown'} ${os.version || ''}
                            </div>
                            <div class="device-item">
                                <strong>Device Type</strong>
                                ${dev.type || 'Desktop'} ${dev.vendor ? `(${dev.vendor})` : ''}
                            </div>
                            <div class="device-item">
                                <strong>Language</strong>
                                ${log.network?.acceptLanguage?.split(',')[0] || 'Unknown'}
                            </div>
                            <div class="device-item">
                                <strong>Timezone</strong>
                                ${geo.timezone || 'Unknown'}
                            </div>
                            <div class="device-item">
                                <strong>Referrer</strong>
                                ${log.network?.referrer === 'Direct' ? 'Direct' : 
                                  new URL(log.network?.referrer).hostname || 'Direct'}
                            </div>
                        </div>
                        
                        <details style="margin-top: 15px;">
                            <summary style="color: #667eea; cursor: pointer; font-size: 13px;">
                                View Raw Data
                            </summary>
                            <div class="json-view">
                                <pre>${JSON.stringify(log, null, 2)}</pre>
                            </div>
                        </details>
                    </div>
                `;
            }).join('');
        }

        function filterLogs() {
            const ipSearch = document.getElementById('searchIP').value.toLowerCase();
            const countryFilter = document.getElementById('filterCountry').value;
            
            const filtered = allLogs.filter(log => {
                const matchesIP = !ipSearch || 
                    log.ip?.address?.toLowerCase().includes(ipSearch);
                const matchesCountry = !countryFilter || 
                    log.geolocation?.location?.country === countryFilter;
                return matchesIP && matchesCountry;
            });
            
            renderLogs(filtered);
        }

        async function clearLogs() {
            if (!confirm('Are you sure you want to delete all logs?')) return;
            
            try {
                await fetch('/api/logs', { method: 'DELETE' });
                loadData();
            } catch (error) {
                alert('Error clearing logs');
            }
        }

        // Auto-refresh every 10 seconds
        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
